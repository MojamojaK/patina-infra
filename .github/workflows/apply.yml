name: apply

on:
  pull_request: {}
  push:
    branches: [mainline]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write # so plan output can comment on the PR

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: infra-plan # no protection rule needed; read-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - name: terraform init
        run: terraform init
      - name: terraform plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
        run: terraform plan -no-color -out=tfplan
      # Plan output is safe to surface: with sensitive outputs marked
      # sensitive = true (outputs.tf), Terraform redacts them from plan/apply
      # text automatically. Nothing secret reaches the PR comment or the log.

  apply:
    needs: plan
    if: github.ref == 'refs/heads/mainline' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # "environment: infra-apply" ties this job to a GitHub Environment with
    # a required-reviewer protection rule — set that up once in repo
    # Settings → Environments → New environment → add yourself as a
    # required reviewer. That is what makes this "approve before it touches
    # the account" rather than "merges to main auto-apply."
    environment: infra-apply
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
      - run: terraform init
      - name: terraform apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_owner_email: ${{ secrets.OWNER_EMAIL }}
        run: terraform apply -auto-approve -no-color
